[package]
name = "gource-draw"
description = "Backend-neutral 2D drawing primitives for Gource: draw lists, textures and fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["ab-glyph"]
ab-glyph = ["dep:ab_glyph"]

[dependencies]
gource-core = { workspace = true }
image = { workspace = true }
ab_glyph = { workspace = true, optional = true }
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
