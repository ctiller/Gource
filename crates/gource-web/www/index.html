<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gource</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gource { width: 100vw; height: 100vh; display: block; outline: none; }
  #status { position: fixed; left: 8px; bottom: 8px; color: #888; font: 12px sans-serif; }
</style>
</head>
<body>
<canvas id="gource"></canvas>
<div id="status"></div>
<script type="module">
  // Query parameters: args=<gource options>, server=<gource-serve URL>,
  // steps=<n> (n fixed 1/60 s steps per animation frame, for captures),
  // and the filter keys ff/fs/uf/us (passed through to /stream).
  import init, { start } from "./pkg/gource_web.js";
  const q = new URLSearchParams(location.search);
  const filter = new URLSearchParams();
  for (const k of ["ff", "fs", "uf", "us"]) for (const v of q.getAll(k)) filter.append(k, v);
  const status = document.getElementById("status");
  try {
    await init();
    await start("gource", q.get("server") ?? "", q.get("args") ?? "", filter.toString(),
                Number(q.get("steps") ?? 0));
  } catch (e) {
    status.textContent = "gource: " + e;
    console.error(e);
  }
</script>
</body>
</html>
