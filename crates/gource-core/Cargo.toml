[package]
name = "gource-core"
description = "Engine-agnostic utilities shared by the Gource crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["glam"]
# Geometry (bounds, quadtree, vector maths) built on glam. Server-side crates
# (model, vcs, history) use gource-core without it.
glam = ["dep:glam"]

[dependencies]
regex = { workspace = true }
glam = { workspace = true, optional = true }
chrono = { workspace = true }
log = { workspace = true }
